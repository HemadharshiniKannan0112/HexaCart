<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#172b4d">
    <meta name="description" content="HexaCart — a simple, reliable online shopping experience.">
    <title>HexaCart | Online Shopping</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="#" data-a="go" data-v="shop" aria-label="HexaCart home">
            <span class="brand-mark">H</span>
            <span>HexaCart</span>
        </a>
        <nav id="nav" aria-label="Main navigation"></nav>
        <div class="theme-switch" role="group" aria-label="Choose appearance">
            <button type="button" id="theme-warm" aria-pressed="true">Warm</button>
            <button type="button" id="theme-dark" aria-pressed="false">Dark</button>
        </div>
    </header>

    <main id="app">
        <div class="loading-state">Loading HexaCart…</div>
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <strong>HexaCart</strong>
            <span>Everyday shopping, made straightforward.</span>
            <details>
                <summary>Technical activity</summary>
                <div id="log" aria-live="polite"></div>
            </details>
        </div>
    </footer>

    <div id="modal" aria-modal="true" role="dialog" aria-label="HexaCart dialog"></div>
    <div id="toast" role="status" aria-live="polite"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="hexacart-firestore-api.js"></script>
    <script src="app.js"></script>
</body>
</html>
